name: Opna Bio
description: Opna Bio is a clinical-stage biopharmaceutical company focused on oncology,
  developing novel small-molecule and targeted-degrader therapeutics against key regulators
  of cancer, including the Hallmarks of Cancer. Its pipeline features OPN-6602 (an EP300/CBP
  inhibitor in Phase 1 for multiple myeloma, granted FDA Fast Track designation), zavabresib
  (OPN-2853, a BET inhibitor with Orphan Drug designation for myelofibrosis), multi-functional
  protein degraders, and additional programs targeting hematologic malignancies and solid
  tumors. The company operates from South San Francisco and San Diego, California, and
  Lausanne, Switzerland.
